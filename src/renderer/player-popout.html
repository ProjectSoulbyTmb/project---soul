<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data: eidovara-media:; media-src eidovara-media: eidovara-online:; connect-src 'none'; object-src 'none'" />
  <title>Eidovara</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="now-playing.css" />
</head>
<body>
  <section class="player-popout" id="popout">
    <strong id="popTitle">Eidovara</strong>
    <small id="popKind"></small>
    <video id="popVideo" playsinline preload="auto"></video>
    <audio id="popAudio" preload="auto"></audio>
    <div class="np-transport">
      <button type="button" id="popPrev" aria-label="Previous">⏮</button>
      <button type="button" id="popPlay" aria-label="Play or pause">▶</button>
      <button type="button" id="popNext" aria-label="Next">⏭</button>
      <button type="button" id="popDock">Dock</button>
    </div>
    <p class="np-honesty" id="popNote">Local playback through eidovara-media. Not a Spotify or YouTube embed.</p>
  </section>
  <script src="player-popout.js"></script>
</body>
</html>
