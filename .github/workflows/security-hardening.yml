# Weekly supply-chain & workflow hardening audit.
# Complements codeql/security.yml by validating GitHub Actions configuration
# itself: explicit permissions, SHA-pinned third-party actions, least privilege.
name: Security Hardening Audit

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/**', 'scripts/check-workflow-security.mjs']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: node scripts/check-workflow-security.mjs
