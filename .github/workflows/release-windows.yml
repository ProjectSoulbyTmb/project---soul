name: Release Windows

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run check
      - run: pnpm run smoke
      - run: pnpm run release:configure
      - run: pnpm run dist:dir
      - name: Create ready-to-run Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = '${{ github.ref_name }}'.TrimStart('v')
          Compress-Archive -Path 'dist/win-unpacked/*' -DestinationPath "dist/Project-Soul-Studios-$version-Windows-x64-Ready.zip" -CompressionLevel Optimal
      - run: pnpm run release:manifest
      - run: pnpm run release:evidence
      - name: Sign build provenance
        uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-path: |
            dist/Project-Soul-Studios-*-Windows-x64-Ready.zip
            dist/update.json
            dist/SHA256SUMS.txt
            dist/SBOM.spdx.json
            dist/CODE-SIGNING-STATUS.txt
            dist/PRIVACY-DECLARATION.json
            dist/PRIVACY.md
            dist/SECURITY.md
            dist/NETWORK-USAGE.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Project Soul Studios ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Project-Soul-Studios-*-Windows-x64-Ready.zip
            dist/update.json
            dist/SHA256SUMS.txt
            dist/SBOM.spdx.json
            dist/CODE-SIGNING-STATUS.txt
            dist/PRIVACY-DECLARATION.json
            dist/PRIVACY.md
            dist/SECURITY.md
            dist/NETWORK-USAGE.md
