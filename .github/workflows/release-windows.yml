name: Release Windows

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: electronuserland/builder:wine
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run check
      - run: pnpm run smoke
      - run: pnpm run release:configure
      - run: pnpm run dist:win
      - run: pnpm run release:manifest
      - run: pnpm run release:evidence
      - name: Sign build provenance
        uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-path: |
            dist/Project-Soul-Alpha-*-Windows-x64-Setup.exe
            dist/Project-Soul-Alpha-*-Windows-x64-Portable.exe
            dist/update.json
            dist/SHA256SUMS.txt
            dist/SBOM.spdx.json
            dist/CODE-SIGNING-STATUS.txt
            dist/PRIVACY-DECLARATION.json
            dist/PRIVACY.md
            dist/SECURITY.md
            dist/NETWORK-USAGE.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Project Soul Alpha ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Project-Soul-Alpha-*-Windows-x64-Setup.exe
            dist/Project-Soul-Alpha-*-Windows-x64-Portable.exe
            dist/update.json
            dist/SHA256SUMS.txt
            dist/SBOM.spdx.json
            dist/CODE-SIGNING-STATUS.txt
            dist/PRIVACY-DECLARATION.json
            dist/PRIVACY.md
            dist/SECURITY.md
            dist/NETWORK-USAGE.md
