# Builds an Authenticode-unsigned Windows NSIS installer on windows-latest.
# v* tags publish a GitHub Release. workflow_dispatch on a branch only uploads
# unsigned artifacts. This workflow does not Authenticode-sign Setup.exe.
name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run check
      - run: pnpm run smoke
      - run: pnpm run release:configure
      - name: Build Windows installer
        run: pnpm run dist:win:installer
      - name: Require updater metadata
        shell: pwsh
        run: if (-not (Test-Path dist/latest.yml)) { throw 'electron-builder did not write dist/latest.yml. GitHub publish config must stay so tagged releases emit updater files. No GH_TOKEN is committed.' }
      - run: pnpm run release:manifest
      - run: pnpm run release:evidence
      - name: Sign build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist/Eidovara-*-Windows-x64-Setup.exe
            dist/update.json
            dist/latest.yml
            dist/SHA256SUMS.txt
            dist/SBOM.spdx.json
            dist/CODE-SIGNING-STATUS.txt
            dist/PRIVACY-DECLARATION.json
            dist/PRIVACY.md
            dist/TERMS.md
            dist/AGE.md
            dist/LEGAL-NOTICES.md
            dist/SECURITY.md
            dist/NETWORK-USAGE.md
            dist/LICENSE
            dist/NOTICE.md
            dist/AUTHORS.md
            dist/TRADEMARKS.md
            dist/THIRD_PARTY_NOTICES.md
            dist/BRAND-ASSET-POLICY.md
            dist/COPYRIGHT-ASSET-REGISTER.md
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Eidovara by Soul Consciousness Studios ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Eidovara-*-Windows-x64-Setup.exe
            dist/update.json
            dist/latest.yml
            dist/SHA256SUMS.txt
            dist/SBOM.spdx.json
            dist/CODE-SIGNING-STATUS.txt
            dist/PRIVACY-DECLARATION.json
            dist/PRIVACY.md
            dist/TERMS.md
            dist/AGE.md
            dist/LEGAL-NOTICES.md
            dist/SECURITY.md
            dist/NETWORK-USAGE.md
            dist/LICENSE
            dist/NOTICE.md
            dist/AUTHORS.md
            dist/TRADEMARKS.md
            dist/THIRD_PARTY_NOTICES.md
            dist/BRAND-ASSET-POLICY.md
            dist/COPYRIGHT-ASSET-REGISTER.md
      - name: Upload unsigned Windows artifacts
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: eidovara-windows-unsigned
          path: |
            dist/Eidovara-*-Windows-x64-Setup.exe
            dist/update.json
            dist/latest.yml
            dist/SHA256SUMS.txt
            dist/SBOM.spdx.json
            dist/CODE-SIGNING-STATUS.txt
