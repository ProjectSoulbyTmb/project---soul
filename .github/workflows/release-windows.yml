name: Release Windows

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run check
      - run: pnpm run smoke
      - run: pnpm run release:configure
      - run: pnpm run dist:win
      - run: pnpm run release:manifest
      - run: pnpm run release:evidence
      - name: Sign build provenance
        uses: actions/attest-build-provenance@v4.1.1
        with:
          subject-path: |
            dist/Project-Soul-Alpha-*-Windows-x64-Setup.exe
            dist/Project-Soul-Alpha-*-Windows-x64-Portable.exe
            dist/update.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/Project-Soul-Alpha-*-Windows-x64-Setup.exe dist/Project-Soul-Alpha-*-Windows-x64-Portable.exe dist/update.json dist/SHA256SUMS.txt dist/SBOM.spdx.json dist/CODE-SIGNING-STATUS.txt --generate-notes --title "Project Soul Alpha $env:GITHUB_REF_NAME"
