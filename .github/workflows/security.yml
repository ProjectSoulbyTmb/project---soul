name: Security checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  test-and-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run check
      - run: pnpm run smoke
      - run: pnpm audit --prod
      - name: Inventory dependency licenses
        run: pnpm licenses list
      - name: Reject private key material
        shell: pwsh
        run: |
          $matches = git grep -n -I -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|BEGIN PKCS12' -- ':!pnpm-lock.yaml' ':!.github/workflows/security.yml'
          if ($LASTEXITCODE -eq 0) { $matches; throw 'Private key material found in tracked files.' }
          if ($LASTEXITCODE -ne 1) { throw 'Secret scan failed.' }
          exit 0
