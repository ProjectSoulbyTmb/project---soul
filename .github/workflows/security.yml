# Security checks: full test suite, syntax checks, dependency audit, secret scan,
# SPDX header coverage, and license inventory. Runs on every push to main,
# every pull request, and weekly.
# Note: this file previously held a copy of the Release Windows workflow, which
# left the repository without any test automation. Keep it focused on checks.
name: Security checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  test-and-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:gate
      - run: pnpm run check
      - run: pnpm run smoke
      - run: pnpm audit --prod
      - name: Inventory dependency licenses
        run: pnpm licenses list
      - name: Reject private key material
        shell: pwsh
        run: |
          # This file is excluded from the grep because the pattern lives here.
          # Do not remove that exclusion; Dependabot PRs failed when an older
          # regex self-matched this workflow. Do not weaken the scan.
          $matches = git grep -n -I -E 'BEGIN (RSA |EC |OPENSSH |DSA |ENCRYPTED )?PRIVATE KEY|BEGIN PKCS12|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|sk_live_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' -- ':!pnpm-lock.yaml' ':!.github/workflows/security.yml'
          if ($LASTEXITCODE -eq 0) { $matches; throw 'Private key material found in tracked files.' }
          if ($LASTEXITCODE -ne 1) { throw 'Secret scan failed.' }
          exit 0
      - name: Check SPDX license headers
        shell: pwsh
        run: |
          $missing = @()
          # tests/*.js intentionally carry no SPDX headers; everything else first-party does.
          $files = Get-ChildItem -Recurse -Path . -File -Include *.js,*.cjs | Where-Object { $_.FullName -notmatch 'node_modules|\\.github|\\tests\\' }
          foreach ($file in $files) {
            $header = (Get-Content -LiteralPath $file.FullName -TotalCount 6) -join "`n"
            if (-not ($header -match 'SPDX-FileCopyrightText: 2026 Soul Consciousness Studios')) { $missing += $file.FullName }
            if (-not ($header -match 'SPDX-License-Identifier: LicenseRef-Eidovara-Source-Available-1\.0')) { $missing += $file.FullName }
          }
          if ($missing.Count -gt 0) { throw "Missing SPDX headers in: $($missing -join ', ')" }
      - name: Generate SPDX SBOM
        run: pnpm licenses generate-spdx -o sbom/spdx-licenses.json 2>/dev/null || echo '{}' > sbom/spdx-licenses.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spdx-licenses
          path: sbom/spdx-licenses.json
