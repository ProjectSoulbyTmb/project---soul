# Automatic repository health check ("auto-debug").
# Runs the full quality gate on a schedule and on demand; opens or updates
# a GitHub issue whenever any gate fails, so regressions surface without
# anyone having to remember to look.
name: Auto-Debug

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: auto-debug
  cancel-in-progress: false

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.3 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all gates
        id: gates
        shell: bash
        run: |
          set -u
          FAILED=""
          run_gate() {
            local name="$1"; shift
            echo "### $name" >> "$GITHUB_STEP_SUMMARY"
            if "$@" >> "$GITHUB_STEP_SUMMARY" 2>&1; then
              echo "✅ passed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ FAILED" >> "$GITHUB_STEP_SUMMARY"
              FAILED="$FAILED $name"
            fi
            echo "$name gate outcome: $?" >> auto-debug.log 2>&1 || true
          }
          {
            echo "# 🤖 Auto-Debug report — $(date -u '+%Y-%m-%d %H:%M UTC')" > "$GITHUB_STEP_SUMMARY"
            echo "ref: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          }
          run_gate "lint"          pnpm run lint
          run_gate "format:check"  pnpm run format:check
          run_gate "type/syntax"   pnpm run check
          run_gate "tests"         pnpm test
          run_gate "smoke"         pnpm run smoke
          run_gate "audit"         pnpm audit --prod --audit-level moderate
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$FAILED" ]; then
            echo "failed_gates=$FAILED" >> "$GITHUB_OUTPUT"
            echo "Failed gates:$FAILED"
            exit 1
          fi
          echo "All gates green."

      - name: Open or update auto-debug issue on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create auto-debug --color d73a4a --description 'Automated health-check failures' 2>/dev/null || true
          TITLE="🤖 Auto-Debug: failing gates (${GITHUB_SHA::7})"
          BODY="$(cat "$GITHUB_STEP_SUMMARY")

          _Auto-generated by the Auto-Debug workflow on commit ${GITHUB_SHA}. Fix the failing gates above, then close this issue._"
          existing=$(gh issue list --state open --label auto-debug --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$BODY"
            gh issue edit "$existing" --title "$TITLE"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label auto-debug
          fi

      - name: Close stale auto-debug issue when green
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --label auto-debug --limit 1 --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All gates green as of ${GITHUB_SHA} — closing."
          fi
