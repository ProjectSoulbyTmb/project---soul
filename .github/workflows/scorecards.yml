# OpenSSF Scorecards. Pins are commit SHAs (current as of 21 August 2026):
#   actions/checkout v7.0.1
#   ossf/scorecard-action v2.4.4
#   github/codeql-action/upload-sarif v4.37.8
# publish_results needs id-token. SARIF upload needs security-events.
# Branch-protection scoring on a public repo still needs an optional PAT;
# this workflow does not invent one.
name: Scorecards supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '17 9 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze repository security posture
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload security findings
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
          category: ossf-scorecard
