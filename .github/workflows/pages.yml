# Publishes docs/ as the one production GitHub Pages site from main only.
# GitHub Pages serves github.io over HTTPS. Do not retarget this workflow at a
# feature branch and do not add a second production site. Merge PR #10 to main
# to update https://projectsoulbytmb.github.io/project---soul/
name: Deploy project website
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
