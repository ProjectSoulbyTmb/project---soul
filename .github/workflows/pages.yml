# Publishes the curated public site as the one production GitHub Pages site from main only.
# Only entries in .github/publish-manifest.txt are published; internal records
# under docs/ (business, IP, operations) are never deployed. Do not retarget this
# workflow at a feature branch and do not add a second production site.
# Live URL: https://projectsoulbytmb.github.io/project---soul/
name: Deploy project website
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml', '.github/publish-manifest.txt']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build publish set from manifest
        shell: bash
        run: bash scripts/build-publish-set.sh docs .github/publish-manifest.txt _publish
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _publish
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
