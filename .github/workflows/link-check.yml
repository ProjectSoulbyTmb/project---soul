# Weekly internal link integrity check for the website in docs/.
# Verifies every local href/src reference resolves to a real file, and that
# on-page #anchors exist. Catches churn damage like broken navs early.
name: Docs Link Check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths: ['docs/**']

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/check-links.mjs
